<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BarrioRed - Contacto</title>
    <link rel="stylesheet" href="styleOthers.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="logo">🏠 BarrioRed</div>
        <input type="checkbox" id="menu">
        <label for="menu" class="menu-icon"><i class="bi bi-list" for="menu"></i></label>
        <nav>
            <ul class="menu-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="services.html">Servicios</a></li>
                <li><a href="verification.html">Verificación</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="auth-container">
                    <a href="login-register.html" class="btn-login">Iniciar Sesión</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container-page">
        <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <h2>Cuéntanos qué necesitas</h2>
            <form id="contact-form">
                <input type="text" id="c-name" placeholder="Tu nombre" required>
                <input type="email" id="c-email" placeholder="Tu correo" required>
                <textarea id="c-msg" rows="5" placeholder="¿En qué podemos ayudarte?" required></textarea>
                <button type="submit" class="btn-main">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formulario = e.target;
            const { error } = await _supabase.from('mensajes').insert([{
                nombre: document.getElementById('c-name').value,
                email: document.getElementById('c-email').value,
                mensaje: document.getElementById('c-msg').value
            }]);
            if (!error) alert("¡Mensaje enviado! Te contactaremos pronto.");
            formulario.reset();
        });
    async function revisarSesion() {
    const { data: { user } } = await _supabase.auth.getUser();

    if (user) {
        const container = document.getElementById('auth-container');
        const nombre = user.user_metadata.full_name || "Vecino";

        container.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-weight: 600; color: #2b4c8c;">Hola, ${nombre}</span>
                <div style="width: 35px; height: 35px; background: #2b4c8c; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;">
                    ${nombre.charAt(0).toUpperCase()}
                </div>
                <button onclick="salir()" style="border: none; background: none; color: #666; cursor: pointer; font-size: 0.8rem;">Cerrar sesión</button>
            </div>
        `;
    }
}

async function salir() {
    await _supabase.auth.signOut();
    window.location.reload();
}

document.addEventListener('DOMContentLoaded', revisarSesion);
    </script>
</body>
</html>
