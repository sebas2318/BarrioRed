<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleLog.css">
    <title>BarrioRed - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="logo">
            🏠BarrioRed
        </div>

        <div id="login-form">
            <h2>¡Hola de nuevo!</h2>
            <p>Ingresa a tu cuenta de vecino.</p>
            <form>
                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="log-email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="log-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
            <div class="footer-links">
                ¿No tienes cuenta? <a href="#" onclick="toggleForms()">Regístrate aquí</a>
            </div>
        </div>

        <div id="register-form" class="hidden">
            <h2>Únete a la red</h2>
            <p>Conecta con expertos en tu barrio.</p>
            <form>
                <div class="input-group">
                    <label>Nombre completo</label>
                    <input type="text" id="reg-name" placeholder="Tu nombre" required>
                </div>
                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="reg-email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Crea una contraseña" required>
                </div>
                <button type="submit" class="btn-primary">Crear Cuenta</button>
            </form>
            <div class="footer-links">
                ¿Ya eres parte? <a href="#" onclick="toggleForms()">Inicia sesión</a>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script>
        function toggleForms() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
        }
    </script>
</body>
</html>
