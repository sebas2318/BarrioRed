<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BarrioRed - Services</title>
    <link rel="stylesheet" href="styleOthers.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="logo">🏠 BarrioRed</div>
        <nav>
            <ul class="menu-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="services.html">Servicios</a></li>
                <li><a href="verification.html">Verificación</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="auth-container">
                    <a href="login-register.html" class="btn-login">Iniciar Sesión</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container-page">
        <h1 style="text-align: center;">Nuestros Servicios</h1>
        <div id="services-grid" class="services-grid">
            <p style="text-align: center;">Cargando servicios...</p>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        async function revisarSesion() {
            if (typeof _supabase === 'undefined') return;
            const { data: { user } } = await _supabase.auth.getUser();

            if (user) {
                const container = document.getElementById('auth-container');
                const nombre = user.user_metadata.full_name || "Vecino";

                container.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-weight: 600; color: #2b4c8c;">Hola, ${nombre}</span>
                        <div style="width: 35px; height: 35px; background: #2b4c8c; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;">
                            ${nombre.charAt(0).toUpperCase()}
                        </div>
                        <button onclick="salir()" style="border: none; background: none; color: #666; cursor: pointer; font-size: 0.8rem;">Cerrar sesión</button>
                    </div>
                `;
            }
        }

        async function salir() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        async function cargarServicios() {
            const grid = document.getElementById('services-grid');
            try {
                const { data, error } = await _supabase.from('servicios').select('*');
                if (error) throw error;

                if (data) {
                    grid.innerHTML = data.map(s => `
                        <div class="service-card">
                            <div style="font-size: 3rem;">${s.icono || '🛠️'}</div>
                            <h3>${s.nombre}</h3>
                            <p>${s.descripcion || 'Servicio profesional para tu hogar.'}</p>
                            <button class="btn-main" onclick="window.location.href='solicitar.html'">Solicitar ahora</button>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error("Error:", err);
                grid.innerHTML = '<p>Error al cargar los servicios.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => { 
            revisarSesion(); 
            cargarServicios(); 
        });
    </script>
</body>
</html>
